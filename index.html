<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Galaxy Calc</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 id="screenTitle">Calculator</h1>
    </header>

    <main class="app-main">
      <!-- ============ TAB 1: CALCULATOR ============ -->
      <section id="panel-calc" class="panel" role="tabpanel" aria-labelledby="tab-calc">
        <div class="display" aria-live="polite">
          <div id="expression" class="expression">0</div>
          <div id="preview" class="preview"></div>
        </div>

        <div id="keypad" class="keypad">
          <button class="key fn"  data-key="C"  aria-label="Clear">C</button>
          <button class="key fn"  data-key="⌫" aria-label="Backspace">⌫</button>
          <button class="key fn"  data-key="%"  aria-label="Percent">%</button>
          <button class="key op"  data-key="÷"  aria-label="Divide">÷</button>

          <button class="key num" data-key="7">7</button>
          <button class="key num" data-key="8">8</button>
          <button class="key num" data-key="9">9</button>
          <button class="key op"  data-key="×"  aria-label="Multiply">×</button>

          <button class="key num" data-key="4">4</button>
          <button class="key num" data-key="5">5</button>
          <button class="key num" data-key="6">6</button>
          <button class="key op"  data-key="−"  aria-label="Minus">−</button>

          <button class="key num" data-key="1">1</button>
          <button class="key num" data-key="2">2</button>
          <button class="key num" data-key="3">3</button>
          <button class="key op"  data-key="+"  aria-label="Plus">+</button>

          <button class="key fn"  data-key="±"  aria-label="Toggle sign">±</button>
          <button class="key num" data-key="0">0</button>
          <button class="key num" data-key="."  aria-label="Decimal point">.</button>
          <button class="key eq"  data-key="="  aria-label="Equals">=</button>
        </div>
      </section>

      <!-- ============ TAB 2: CONVERTERS ============ -->
      <section id="panel-convert" class="panel" role="tabpanel" aria-labelledby="tab-convert" hidden>
        <div class="form">
          <label class="field">
            <span class="label">Category</span>
            <select id="category" class="select">
              <option value="Speed">Speed</option>
              <option value="Length">Length</option>
              <option value="Volume">Volume</option>
              <option value="Currency">Currency</option>
            </select>
          </label>

          <div class="card">
            <span class="label">From</span>
            <div class="row">
              <input id="fromValue" class="input" type="number" inputmode="decimal" step="any" value="1" aria-label="Value to convert">
              <select id="fromUnit" class="select" aria-label="From unit"></select>
            </div>
          </div>

          <button id="swapBtn" class="swap" aria-label="Swap units">⇅</button>

          <div class="card">
            <span class="label">To</span>
            <div class="row">
              <input id="toValue" class="input" type="text" readonly aria-label="Converted value">
              <select id="toUnit" class="select" aria-label="To unit"></select>
            </div>
          </div>

          <p id="rateNote" class="note"></p>
          <p id="currencyStatus" class="note" hidden></p>
        </div>
      </section>

      <!-- ============ TAB 3: MATH SOLVER ============ -->
      <section id="panel-solve" class="panel" role="tabpanel" aria-labelledby="tab-solve" hidden>
        <div class="form">
          <label class="field">
            <span class="label">Equation</span>
            <input id="equationInput" class="input" type="text" placeholder="e.g. 2x + 5 = 17" autocomplete="off" spellcheck="false">
          </label>

          <label class="field">
            <span class="label">Gemini API key</span>
            <div class="row key-row">
              <input id="apiKey" class="input" type="password" placeholder="Paste your key" autocomplete="off" spellcheck="false">
              <button id="toggleKey" class="btn ghost" type="button" aria-pressed="false">Show</button>
            </div>
          </label>

          <button id="solveBtn" class="btn primary" type="button">Solve Step-by-Step</button>
          <p id="solveStatus" class="note" role="status" aria-live="polite"></p>

          <label class="field grow">
            <span class="label">Solution</span>
            <textarea id="solution" class="textarea" readonly placeholder="Step-by-step solution will appear here."></textarea>
          </label>
        </div>
      </section>
    </main>

    <nav class="tabbar" role="tablist" aria-label="App sections">
      <button id="tab-calc" class="tab" role="tab" aria-selected="true" aria-controls="panel-calc" data-panel="panel-calc" data-title="Calculator">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="3"/><path d="M8 7h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/></svg>
        <span>Calculator</span>
      </button>
      <button id="tab-convert" class="tab" role="tab" aria-selected="false" aria-controls="panel-convert" data-panel="panel-convert" data-title="Converters" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h15l-4-4M20 16H5l4 4"/></svg>
        <span>Converters</span>
      </button>
      <button id="tab-solve" class="tab" role="tab" aria-selected="false" aria-controls="panel-solve" data-panel="panel-solve" data-title="Math Solver" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5H7l6 7-6 7h11"/></svg>
        <span>Math Solver</span>
      </button>
    </nav>
  </div>
</body>
</html>
